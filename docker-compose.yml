services:
  # Web service for the Laravel app
  web:
    build: .
    container_name: cloudtodo_web
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
    networks:
      - cloudtodo_network
    depends_on:
      - db

  # Database service (using MySQL)
  db:
    image: mysql:8.0
    container_name: cloudtodo_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: cloudtodo
      MYSQL_USER: user
      MYSQL_PASSWORD: user_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - cloudtodo_network

volumes:
  db_data:

networks:
  cloudtodo_network:
    driver: bridge
